<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seleccionar de una lista plegable un color y mostrarlos por la consola.</title>
</head>
<body>
    <h1>Lista Plegable</h1>
    <label for="selectColor">Selecciona un color:</label>
    <select id="selectColor">
        <option value="">--Seleccione un color--</option>
        <option value="Rojo">Rojo</option>
        <option value="Verde">Verde</option>
        <option value="Azul">Azul</option>
        <option value="Amarillo">Amarillo</option>
    </select>

    <script>
        const selectColor = document.getElementById("selectColor");

        selectColor.addEventListener("change", function() {
            let colorSeleccionado = selectColor.value;
            console.log("Color seleccionado:", colorSeleccionado);
        });
    </script>
</body>
</html>
